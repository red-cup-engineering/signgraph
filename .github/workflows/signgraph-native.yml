name: SignGraph native
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: signgraph-native-${{ github.ref }}
  cancel-in-progress: true
jobs:
  native:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Check source syntax
        run: find src -name '*.mjs' -print0 | xargs -0 -n1 node --check
      - name: Test the packed library through its published exports
        run: |
          consumer=$(mktemp -d)
          trap 'rm -rf "$consumer"' EXIT
          archive=$(npm pack --silent --ignore-scripts --pack-destination "$consumer")
          cp -R test "$consumer/test"
          cd "$consumer"
          npm install --ignore-scripts --no-audit --no-fund --registry=https://registry.561.group/ "./$archive"
          node --test
