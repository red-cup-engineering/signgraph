name: SignGraph native
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: signgraph-native-${{ github.ref }}
  cancel-in-progress: true
jobs:
  native:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'pnpm'
          cache-dependency-path: pnpm-lock.yaml
      - name: Install suppliers from the committed pnpm lock and the Group registry
        run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Check source syntax
        run: find src -name '*.mjs' -print0 | xargs -0 -n1 node --check
      - name: Inspect package publication contents
        run: npm pack --dry-run --json
